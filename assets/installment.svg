<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="t d">
<title id="t">โครงสร้างค่างวดผ่อนคอมพิวเตอร์</title><desc id="d">แต่ละงวดจ่ายเงินต้นคงที่ 2,000 บาท บวกดอกเบี้ย 1% ของยอดค้างที่ลดลงเรื่อย ๆ</desc>
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e2245"/><stop offset="100%" stop-color="#171a35"/>
  </linearGradient>
</defs>
<rect width="600" height="300" rx="18" fill="url(#fade)"/>
<text x='24' y='30' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='14' fill='#eef1ff' text-anchor='start' font-weight='600' >โครงสร้างค่างวดแต่ละเดือน</text>
<rect x='58' y='120.0' width='56' height='116.0' rx='4' fill='#8a7bff' opacity='0.55'/>
<rect x='58' y='50.400000000000006' width='56' height='69.6' rx='4' fill='#ffb340' opacity='0.85'/>
<text x='86.0' y='42.400000000000006' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='11' fill='#ffb340' text-anchor='middle' font-weight='600' >500</text>
<text x='86.0' y='252' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='10' fill='#a4abd6' text-anchor='middle' font-weight='400' >งวด 1</text>
<text x='86.0' y='266' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='9' fill='#a4abd6' text-anchor='middle' font-weight='400' >ค้าง 50,000</text>
<rect x='140' y='120.0' width='56' height='116.0' rx='4' fill='#8a7bff' opacity='0.55'/>
<rect x='140' y='53.184' width='56' height='66.816' rx='4' fill='#ffb340' opacity='0.85'/>
<text x='168.0' y='45.184' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='11' fill='#ffb340' text-anchor='middle' font-weight='600' >480</text>
<text x='168.0' y='252' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='10' fill='#a4abd6' text-anchor='middle' font-weight='400' >งวด 2</text>
<text x='168.0' y='266' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='9' fill='#a4abd6' text-anchor='middle' font-weight='400' >ค้าง 48,000</text>
<rect x='222' y='120.0' width='56' height='116.0' rx='4' fill='#8a7bff' opacity='0.55'/>
<rect x='222' y='55.968' width='56' height='64.032' rx='4' fill='#ffb340' opacity='0.85'/>
<text x='250.0' y='47.968' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='11' fill='#ffb340' text-anchor='middle' font-weight='600' >460</text>
<text x='250.0' y='252' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='10' fill='#a4abd6' text-anchor='middle' font-weight='400' >งวด 3</text>
<text x='250.0' y='266' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='9' fill='#a4abd6' text-anchor='middle' font-weight='400' >ค้าง 46,000</text>
<text x='328' y='190' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='20' fill='#a4abd6' text-anchor='middle' font-weight='400' >. . .</text>
<text x='328' y='252' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='10' fill='#22d3a7' text-anchor='middle' font-weight='600' >งวดที่ ?</text>
<line x1='40' y1='236' x2='400' y2='236' stroke='#343a6b' stroke-width='1.5'/>
<rect x='410' y='96' width='12' height='12' rx='3' fill='#ffb340' opacity='0.85'/>
<text x='430' y='106' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='11' fill='#a4abd6' text-anchor='start' font-weight='400' >ดอกเบี้ย 1% ของยอดค้าง</text>
<rect x='410' y='120' width='12' height='12' rx='3' fill='#8a7bff' opacity='0.55'/>
<text x='430' y='130' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='11' fill='#a4abd6' text-anchor='start' font-weight='400' >เงินต้น 2,000 บาท (คงที่)</text>
<text x='24' y='286' font-family='IBM Plex Sans Thai, Segoe UI, sans-serif' font-size='12' fill='#a4abd6' text-anchor='start' font-weight='400' >ราคาเครื่อง 50,000 บาท  ผ่อนเงินต้นเดือนละ 2,000 บาทเท่ากันทุกเดือน</text>
</svg>
